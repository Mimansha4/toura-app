<div class="page-container">

  <!-- ================= MAP SECTION ================= -->
  <div class="map-section">
    <div id="map"></div>

    <button class="report-btn" (click)="openModal()">
      🚨 Report a Scam
    </button>
  </div>

  <!-- ================= TOP 5 STATS SECTION ================= -->
  <div class="stats-section">

    <div class="stats-container">

      <h2 class="stats-title">🔥 Top 5 Scams (By Reports)</h2>

      <div *ngIf="topScams.length > 0; else noData" class="stats-grid">

        <div
          class="stat-card"
          *ngFor="let scam of topScams; let i = index"
          [ngClass]="'type-' + scam.type"
          [style.animationDelay]="i * 0.15 + 's'">

          <div class="rank-badge">
            #{{ i + 1 }}
          </div>

          <div class="stat-content">
            <div class="stat-type">{{ scam.type }}</div>

            <div class="stat-count">
              <span class="count-number">
                {{ animatedCounts[i] ?? scam.count }}
              </span>
              reports
            </div>

            <div class="progress-bar">
              <div
                class="progress-fill"
                [style.width.%]="(scam.count / topScams[0].count) * 100">
              </div>
            </div>
          </div>

        </div>

      </div>

      <ng-template #noData>
        <p>No scam reports yet.</p>
      </ng-template>

    </div>

  </div>

  <!-- ================= SAFETY GUIDE SECTION ================= -->
  <div class="guide-section">

    <h2 class="guide-title">🛡 Scam Safety Guide</h2>

    <div class="guide-container">

      <div class="guide-card"
           *ngFor="let guide of scamGuides; let i = index"
           (click)="toggleGuide(i)">

        <div class="guide-header">
          {{ guide.title }}
          <span class="arrow" [class.rotate]="guide.open">▼</span>
        </div>

        <div class="guide-body" *ngIf="guide.open">

          <h4>Precautions</h4>
          <ul>
            <li *ngFor="let p of guide.precautions">{{ p }}</li>
          </ul>

          <h4>If It Happens</h4>
          <ul>
            <li *ngFor="let a of guide.actions">{{ a }}</li>
          </ul>

        </div>

      </div>

    </div>

  </div>

</div>


<!-- ================= MODAL ================= -->
<div class="modal-backdrop" *ngIf="showModal">
  <div class="modal-content">

    <h3>Report a Scam</h3>
    <form [formGroup]="reportForm" (ngSubmit)="submitReport()">

  <!-- Select Scam -->
  <select
    formControlName="type"
    [class.invalid]="reportForm.get('type')?.touched && reportForm.get('type')?.invalid">

    <option value="" disabled>Select Scam</option>

    <option *ngFor="let type of scamTypes" [value]="type">
      {{ type }}
    </option>
  </select>

  <!-- Error for Select -->
  <div class="error-text"
       *ngIf="reportForm.get('type')?.touched &&
              reportForm.get('type')?.invalid">
    Please select a scam type.
  </div>


  <!-- Description -->
  <textarea
    formControlName="description"
    placeholder="Minimum 10 characters"
    [class.invalid]="reportForm.get('description')?.touched &&
                     reportForm.get('description')?.invalid">
  </textarea>

  <!-- Error for Description -->
  <div class="error-text"
       *ngIf="reportForm.get('description')?.touched &&
              reportForm.get('description')?.errors?.['minlength']">
    Minimum 10 characters required.
  </div>


  <div class="modal-buttons">
    <button type="button" (click)="closeModal()">Cancel</button>
    <button type="submit">Submit</button>
  </div>

</form>

    

  </div>
</div>
